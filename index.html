<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>카드 캐시백</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="css/style.css?v=23">
</head>
<body>

  <!-- 첫 화면. 서버 응답을 기다리는 동안 빈 페이지가 보이지 않게 한다 -->
  <div id="splash">
    <div class="login-logo">카드 <em>캐시백</em></div>
    <div class="splash-bar"><i></i></div>
    <p class="splash-msg" id="splash-msg">불러오는 중</p>
  </div>

  <!-- 로그인 -->
  <div id="login" class="hide">
    <div class="login-logo">카드 <em>캐시백</em></div>
    <p class="login-sub">프로모션 조건을 읽고, 자격을 따지고,<br>들어올 돈을 놓치지 않게.</p>
    <div class="seg" id="li-seg" style="margin-bottom:4px">
      <button class="seg-btn on" data-mode="login">로그인</button>
      <button class="seg-btn" data-mode="signup">회원가입</button>
    </div>

    <div id="li-login">
      <label>아이디<input id="li-id" autocomplete="username"></label>
      <label>비밀번호<input id="li-pw" type="password" autocomplete="current-password"></label>
    </div>

    <div id="li-signup" class="hide">
      <label>아이디<input id="su-id" autocomplete="username" placeholder="영문, 숫자로 4자 이상"></label>
      <label>비밀번호<input id="su-pw" type="password" autocomplete="new-password" placeholder="6자 이상"></label>
      <label>이름<input id="su-name" placeholder="앱에서 보일 이름"></label>
      <label id="su-invite-wrap" class="hide">초대 코드<input id="su-invite"></label>
      <label class="chk agree"><input type="checkbox" id="su-agree">
        <span><a href="terms.html" target="_blank" rel="noopener">이용약관</a>과
        <a href="privacy.html" target="_blank" rel="noopener">개인정보처리방침</a>에 동의합니다</span>
      </label>
      <p class="hint">이 앱은 카드사, 카드명, 사용 시점, 캐시백 수령 기록을 저장합니다.
      카드번호나 비밀번호, 금융기관 로그인 정보는 받지 않습니다.
      언제든 설정에서 탈퇴하면 저장된 기록이 모두 삭제됩니다.</p>
      <p class="hint">비밀번호는 되돌릴 수 없는 형태로 저장되지만, 다른 곳에서 쓰는 비밀번호는 쓰지 마세요.</p>
    </div>

    <div id="li-err"></div>
    <button class="cta" id="li-btn" style="margin-top:14px">들어가기</button>
  </div>

  <!-- 앱 본체 -->
  <div id="app" class="hide">
    <header>
      <div class="logo">카드 <em>캐시백</em></div>
      <span id="hello"></span>
      <button id="settings" title="설정">설정</button>
    </header>

    <main id="main"></main>

    <footer>
      <div class="foot-links">
        <a href="terms.html" target="_blank" rel="noopener">이용약관</a>
        <a href="privacy.html" target="_blank" rel="noopener">개인정보처리방침</a>
        <a href="#" id="foot-contact">문의</a>
      </div>
      <div>카드 캐시백 <span id="ver"></span></div>
    </footer>

    <button id="fab" class="fab hide" title="공고 분석하기" aria-label="공고 분석하기">+</button>

    <nav class="tabbar">
      <button data-tab="cards"><span class="ico">💳</span>내 카드</button>
      <button data-tab="promo"><span class="ico">🎁</span>프로모션</button>
      <button data-tab="stats"><span class="ico">🔥</span>인기</button>
      <button data-tab="report"><span class="ico">📊</span>결산</button>
      <button data-tab="archive"><span class="ico">📦</span>아카이브</button>
    </nav>
  </div>

  <script src="js/config.js?v=23"></script>
  <script src="js/core.js?v=23"></script>
  <script src="js/auth.js?v=23"></script>
  <script src="js/pages.js?v=23"></script>
  <script src="js/main.js?v=23"></script>
</body>
</html>
